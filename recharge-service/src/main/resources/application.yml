server:
  port: 8085

spring:
  application:
    name: recharge-service
  datasource:
    url: jdbc:postgresql://localhost:5432/recharge_db
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
